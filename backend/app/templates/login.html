<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | AskMate</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">AskMate</div>
        <div class="subtitle">로그인하여 AI와 대화를 시작해 보세요.</div>

        <form id="login-form">
            <div id="login-error-msg" class="error-msg-box"></div>

            <div class="form-group">
                <label for="login-username">아이디</label>
                <input id="login-username" name="username" type="text" autocomplete="username" placeholder="아이디를 입력하세요" required autofocus>
            </div>

            <div class="form-group">
                <label for="login-password">비밀번호</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button id="login-btn" class="btn-submit" type="submit">로그인</button>
        </form>

        <div class="auth-footer">
            <span>계정이 없으신가요? <a href="/signup">회원가입하기</a></span>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/auth_page.js') }}" defer></script>
</body>
</html>
