{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">로그인</h1>
            <p class="auth-subtitle">AskMate AI 챗봇 서비스를 이용하시려면 로그인해 주세요.</p>
        </div>

        <div id="loginAlert" class="alert" style="display: none;" role="alert"></div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="loginUsername" class="form-label">아이디 (사용자명)</label>
                <input 
                    type="text" 
                    id="loginUsername" 
                    name="username" 
                    class="form-input" 
                    placeholder="아이디를 입력하세요" 
                    autocomplete="username" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="loginPassword" class="form-label">비밀번호</label>
                </div>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        class="form-input" 
                        placeholder="비밀번호를 입력하세요" 
                        autocomplete="current-password" 
                        required
                    >
                    <button type="button" class="btn-icon toggle-password" data-target="loginPassword" title="비밀번호 표시/숨김" aria-label="비밀번호 표시 토글">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
                    <span class="btn-text">로그인</span>
                    <span class="btn-spinner" style="display: none;">로그인 중...</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p>아직 계정이 없으신가요? <a href="{{ url_for('signup_page') }}" class="link-primary">회원가입</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/login.js') }}" defer></script>
{% endblock %}
