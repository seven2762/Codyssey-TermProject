<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AskMate{% endblock %} | AskMate</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
</head>
<body>
    <header>
        <p>AskMate</p>
        <nav aria-label="주 메뉴">
            <a href="{{ url_for('login_page') }}">로그인</a>
            <a href="{{ url_for('signup_page') }}">회원가입</a>
            <a href="{{ url_for('chat_page') }}">채팅</a>
            <a href="{{ url_for('history_page') }}">대화 기록</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
