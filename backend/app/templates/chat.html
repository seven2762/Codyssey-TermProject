<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AskMate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <button id="new-chat-btn" class="btn-primary" type="button">+ 새 대화 시작</button>

            <div class="sidebar-section">
                <span class="section-title">최근 대화 목록</span>
                <div id="history-list"></div>
            </div>

            <div class="sidebar-footer">
                <div id="user-profile-area" class="user-profile"></div>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <h2>AskMate AI</h2>
                <div>
                    <span id="header-user-status">비로그인 상태</span>
                </div>
            </header>

            <div id="chat-box" class="chat-box">
                <div id="welcome-card" class="welcome-card">
                    <h3>💡 무엇이든 물어보세요!</h3>
                    <p>AskMate는 로그인 후 AI와 연속적인 대화를 나누고 기록을 관리할 수 있습니다.</p>
                </div>
            </div>

            <div class="chat-input-container">
                <div id="guest-input-overlay" class="guest-overlay">🔒 질문을 입력하려면 <strong>로그인</strong>이 필요합니다. (클릭하여 로그인)</div>

                <textarea id="chat-input" placeholder="질문을 입력하세요..." maxlength="1000" disabled></textarea>
                <div class="input-bottom-bar">
                    <span id="char-counter" class="char-counter">0 / 1,000자</span>
                    <button id="send-btn" class="btn-send" type="button" disabled>전송</button>
                </div>
            </div>
        </main>
    </div>

    <div id="login-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AskMate 로그인</h3>
                <span class="close-btn" data-close="login-modal">×</span>
            </div>

            <form id="login-form">
                <div id="login-error-msg" class="error-msg-box"></div>

                <div class="form-group">
                    <label for="login-username">아이디</label>
                    <input id="login-username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="login-password">비밀번호</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="btn-submit" type="submit">로그인</button>
            </form>

            <div class="modal-footer">
                <span>계정이 없으신가요? <a href="#" id="signup-link">회원가입하기</a></span>
            </div>
        </div>
    </div>

    <div id="signup-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AskMate 회원가입</h3>
                <span class="close-btn" data-close="signup-modal">×</span>
            </div>

            <form id="signup-form">
                <div id="signup-error-msg" class="error-msg-box"></div>

                <div class="form-group">
                    <label for="signup-username">아이디</label>
                    <input id="signup-username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">비밀번호</label>
                    <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="signup-password-confirm">비밀번호 확인</label>
                    <input id="signup-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
                </div>

                <button class="btn-submit" type="submit">회원가입</button>
            </form>

            <div class="modal-footer">
                <span>이미 계정이 있으신가요? <a href="#" id="login-link">로그인하기</a></span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/js/chat.js') }}" defer></script>
    <script src="{{ url_for('static', path='/js/auth_sidebar.js') }}" defer></script>
</body>
</html>
