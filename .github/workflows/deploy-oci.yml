name: Docker CI and OCI deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-oci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: 2hynmin/codyssey-term
  CONTAINER_NAME: askmate-backend

jobs:
  verify-image:
    name: Verify Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish image and deploy to OCI
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: oci-production
      cancel-in-progress: false
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
      OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT || '22' }}
      OCI_APP_PORT: ${{ vars.OCI_APP_PORT || '8000' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: 2hynmin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          for required_name in \
            DOCKERHUB_TOKEN \
            OCI_HOST \
            OCI_SSH_USER \
            OCI_SSH_PRIVATE_KEY \
            OCI_SSH_KNOWN_HOSTS
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required secret: ${required_name}" >&2
              exit 1
            fi
          done

          if [[ ! "$OCI_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_SSH_PORT must be numeric." >&2
            exit 1
          fi

          if [[ ! "$OCI_APP_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_APP_PORT must be numeric." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/oci_deploy_key"
          chmod 600 "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to Docker Hub on OCI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "docker login --username 2hynmin --password-stdin"

      - name: Replace OCI container
        shell: bash
        env:
          TARGET_IMAGE: 2hynmin/codyssey-term:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          printf -v remote_environment \
            'TARGET_IMAGE=%q CONTAINER_NAME=%q OCI_APP_PORT=%q' \
            "$TARGET_IMAGE" "$CONTAINER_NAME" "$OCI_APP_PORT"

          ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "$remote_environment bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          backup_container="${CONTAINER_NAME}-previous"
          env_file="/opt/askmate/.env"

          docker pull "$TARGET_IMAGE"
          docker rm --force "$backup_container" >/dev/null 2>&1 || true

          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop "$CONTAINER_NAME"
            docker rename "$CONTAINER_NAME" "$backup_container"
          fi

          run_options=(
            --detach
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            --publish "${OCI_APP_PORT}:8000"
          )

          if [[ -f "$env_file" ]]; then
            run_options+=(--env-file "$env_file")
          fi

          rollback() {
            docker logs --tail 100 "$CONTAINER_NAME" 2>/dev/null || true
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if docker container inspect "$backup_container" >/dev/null 2>&1; then
              docker rename "$backup_container" "$CONTAINER_NAME"
              docker start "$CONTAINER_NAME"
            fi
          }

          if ! docker run "${run_options[@]}" "$TARGET_IMAGE"; then
            rollback
            exit 1
          fi

          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER_NAME"
            )"

            if [[ "$health_status" == "healthy" ]]; then
              docker rm --force "$backup_container" >/dev/null 2>&1 || true
              exit 0
            fi

            if [[ "$health_status" == "unhealthy" || "$health_status" == "exited" ]]; then
              break
            fi

            sleep 2
          done

          rollback
          exit 1
          REMOTE_SCRIPT
