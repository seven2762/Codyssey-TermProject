name: Docker CI and OCI deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-oci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: 2hynmin/codyssey-term
  CONTAINER_NAME: askmate-backend

jobs:
  verify-image:
    name: Verify Docker image
    # 같은 저장소의 PR은 publish-and-deploy가 빌드까지 수행하므로 중복 빌드를 피한다.
    # 시크릿을 받지 못해 배포할 수 없는 포크 PR에서만 빌드 가능 여부를 확인한다.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish image and deploy to OCI
    # 릴리스 서버가 아니므로 PR 단계에서 실제 배포까지 수행하고, 이 잡이 통과해야 머지한다.
    # 포크 PR은 환경 시크릿을 받지 못하므로 verify-image만 수행한다.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: oci-production
      cancel-in-progress: false
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT || '22' }}
      OCI_APP_PORT: ${{ vars.OCI_APP_PORT || '8000' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          for required_name in \
            DOCKERHUB_TOKEN \
            OCI_HOST \
            OCI_SSH_USER \
            OCI_SSH_PRIVATE_KEY \
            OCI_SSH_KNOWN_HOSTS \
            TS_OAUTH_CLIENT_ID \
            TS_AUDIENCE
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required secret: ${required_name}" >&2
              exit 1
            fi
          done

          if [[ ! "$OCI_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_SSH_PORT must be numeric." >&2
            exit 1
          fi

          if [[ ! "$OCI_APP_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_APP_PORT must be numeric." >&2
            exit 1
          fi

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # pull_request의 github.sha는 임시 병합 커밋이므로 추적 가능한 head 커밋을 쓴다.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            revision="$PR_HEAD_SHA"
          else
            revision="$PUSH_SHA"
          fi

          tags=("${IMAGE_NAME}:sha-${revision}")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # 검증 중인 PR 이미지가 :latest를 덮어쓰지 않도록 한다.
            tags+=("${IMAGE_NAME}:pr-${PR_NUMBER}")
          else
            tags+=("${IMAGE_NAME}:latest")
          fi

          {
            echo "revision=${revision}"
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: 2hynmin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Connect deployment runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.OCI_HOST }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/oci_deploy_key"
          chmod 600 "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to Docker Hub on OCI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "docker login --username 2hynmin --password-stdin"

      - name: Replace OCI container
        shell: bash
        env:
          TARGET_IMAGE: 2hynmin/codyssey-term:sha-${{ steps.image.outputs.revision }}
        run: |
          set -euo pipefail

          printf -v remote_environment \
            'TARGET_IMAGE=%q CONTAINER_NAME=%q OCI_BIND_HOST=%q OCI_APP_PORT=%q' \
            "$TARGET_IMAGE" "$CONTAINER_NAME" "$OCI_HOST" "$OCI_APP_PORT"

          ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "$remote_environment bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          backup_container="${CONTAINER_NAME}-previous"
          env_file="/opt/askmate/.env"

          if ! tailscale ip -4 | grep -Fxq "$OCI_BIND_HOST"; then
            echo "OCI_HOST is not assigned to this server's Tailscale interface." >&2
            exit 1
          fi

          docker pull "$TARGET_IMAGE"
          docker rm --force "$backup_container" >/dev/null 2>&1 || true

          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop "$CONTAINER_NAME"
            docker rename "$CONTAINER_NAME" "$backup_container"
          fi

          run_options=(
            --detach
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            --publish "${OCI_BIND_HOST}:${OCI_APP_PORT}:8000"
            --mount "type=volume,source=askmate-data,target=/app/data"
          )

          if [[ -f "$env_file" ]]; then
            run_options+=(--env-file "$env_file")
          fi

          rollback() {
            docker logs --tail 100 "$CONTAINER_NAME" 2>/dev/null || true
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if docker container inspect "$backup_container" >/dev/null 2>&1; then
              docker rename "$backup_container" "$CONTAINER_NAME"
              docker start "$CONTAINER_NAME"
            fi
          }

          if ! docker run "${run_options[@]}" "$TARGET_IMAGE"; then
            rollback
            exit 1
          fi

          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER_NAME"
            )"

            if [[ "$health_status" == "healthy" ]]; then
              docker rm --force "$backup_container" >/dev/null 2>&1 || true
              exit 0
            fi

            if [[ "$health_status" == "unhealthy" || "$health_status" == "exited" ]]; then
              break
            fi

            sleep 2
          done

          rollback
          exit 1
          REMOTE_SCRIPT
